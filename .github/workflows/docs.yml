name: docs

on:
  push:
    # Only run the docs workflow when the docs are changed, or public headers
    # used to generate Doxygen files, or the workflow itself.
    paths:
      - 'src/doc/**'
      - 'src/include/OpenImageIO/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/build-steps.yml'
      - '.readthedocs.yml'
      - 'testsuite/docs-examples-*/**'
  pull_request:
    paths:
      - 'src/doc/**'
      - 'src/include/OpenImageIO/**'
      - 'docs/**'
      - '**/docs.yml'
  schedule:
    # Full nightly build
    - cron: "0 8 * * *"
  workflow_dispatch:
    # This allows manual triggering of the workflow from the web

permissions: read-all

# Allow subsequent pushes to the same PR or REF to cancel any previous jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  docs:
    name: "Docs / ${{matrix.desc}}"
    # Scheduled runs only on the canonical repository.
    if: github.event_name != 'schedule' || github.repository == 'AcademySoftwareFoundation/OpenImageIO'
    uses: ./.github/workflows/build-steps.yml
    with:
      nametag: ${{ matrix.nametag || 'unnamed!' }}
      runner: ${{ matrix.runner || 'ubuntu-latest' }}
      container: ${{ matrix.container }}
      cc_compiler: ${{ matrix.cc_compiler }}
      cxx_compiler: ${{ matrix.cxx_compiler }}
      cxx_std: ${{ matrix.cxx_std || '17' }}
      build_type: ${{ matrix.build_type || 'Release' }}
      depcmds: ${{ matrix.depcmds }}
      extra_artifacts: ${{ matrix.extra_artifacts }}
      python_ver: ${{ matrix.python_ver }}
      setenvs: ${{ matrix.setenvs }}
      simd: ${{ matrix.simd }}
      skip_build: ${{ matrix.skip_build }}
      skip_tests: ${{ matrix.skip_tests }}
      abi_check: ${{ matrix.abi_check }}
      build_docs: ${{ matrix.build_docs }}
      generator: ${{ matrix.generator }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - desc: docs
            nametag: docslinux
            runner: ubuntu-latest
            cxx_std: 17
            python_ver: "3.12"
            build_docs: 1
            skip_build: 1
            skip_tests: 1
            setenvs: export EXTRA_DEP_PACKAGES="doxygen sphinx-doc"
                            PIP_INSTALLS="sphinx>=9.1 breathe>=5.1 sphinx-tabs>=3.5 furo>=2025.12.19 myst-parser>=5.1"
                            SKIP_SYSTEM_DEPS_INSTALL=1
                            USE_OPENCV=0 USE_FFMPEG=0 USE_FREETYPE=0
                            USE_LIBHEIF=0 QT_VERSION=0 PYBIND11_VERSION=0
