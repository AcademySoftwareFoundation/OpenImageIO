# Verify that .github/workflows/actions.lock is in sync with the workflows
# and that every locked pin still verifies upstream.
# If you add, remove, or change the version of any `uses:` action (or add
# a new workflow file), regenerate the lockfile and commit it:
#     gh extension install github/gh-actions-lock   # once
#     gh actions-lock
# https://docs.github.com/actions/concepts/security/workflow-dependency-lockfiles

name: lockfile

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  schedule:
    # Weekly, to catch locked pins that no longer verify upstream
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: "Verify actions.lock"
    if: github.repository == 'AcademySoftwareFoundation/OpenImageIO' || github.event_name != 'schedule'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
